<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registry Admin - Metrics</title>
    <link rel="stylesheet" href="/admin/assets/registry_admin.css" />
  </head>
  <body class="registry-admin">
    <header class="topbar">
      <div>
        <div class="eyebrow">PeerMesh</div>
        <h1>Registry Metrics</h1>
      </div>
      <nav>
        <a href="/admin">Dashboard</a>
        <a href="/admin/relays">Relay Directory</a>
        <a href="/admin/federation">Federation</a>
        <a href="/admin/beta-program">Beta Program</a>
        <a href="/admin/moderation-reports">Moderation Reports</a>
        <a href="/admin/feedback">Feedback</a>
        <a href="/admin/certificates">Certificates</a>
        <a href="/admin/metrics" class="active">Metrics</a>
        <button id="logout-button" type="button" class="ghost hidden">Logout</button>
      </nav>
    </header>

    <main class="shell">
      <section id="login-panel" class="panel narrow">
        <h2>Admin Login</h2>
        <form id="login-form" class="form">
          <label>
            Username
            <input name="username" autocomplete="username" value="admin" />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" />
          </label>
          <button type="submit">Login</button>
        </form>
        <div id="login-status" class="status"></div>
      </section>

      <section id="app-panel" class="hidden">
        <section class="panel">
          <div class="section-head">
            <div>
              <h2>Operational Metrics</h2>
              <p>Registry heartbeat, discovery, certificate, audit and federation session counters.</p>
            </div>
            <button id="refresh-button" type="button">Refresh</button>
          </div>
          <div id="metrics-grid" class="kpi-grid"></div>
          <div id="metrics-meta" class="meta-strip"></div>
        </section>

        <section class="split">
          <article class="panel">
            <h2>Traffic Rates</h2>
            <div id="metrics-rates-grid" class="detail-grid"></div>
          </article>
          <article class="panel">
            <h2>Federation Sessions</h2>
            <div id="metrics-federation-grid" class="detail-grid"></div>
          </article>
        </section>

        <section class="panel">
          <h2>Notes</h2>
          <div id="metrics-notes" class="detail-grid"></div>
        </section>
      </section>
    </main>

    <script src="/admin/assets/registry_admin.js"></script>
  </body>
</html>
