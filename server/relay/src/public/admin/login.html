<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay Admin — Login</title>
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body class="admin">
    <header class="site-header">
      <div class="brand">
        <span class="logo-dot"></span>
        <div>
          <div class="brand-title">Relay Admin</div>
          <div class="brand-subtitle">Operator Console</div>
        </div>
      </div>
      <button id="menu-toggle" class="menu-toggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <nav id="menu" class="menu">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/peers">Federation</a>
        <a href="/admin/banlist">Banlist</a>
        <a href="/admin/reputation">Reputation</a>
        <a href="/admin/audit">Audit Trail</a>
        <a href="/admin/settings">Settings</a>
        <a href="/admin/login" class="active auth-guest">Login</a>
      </nav>
    </header>

    <main class="shell">
      <section class="card login-card">
        <h1>Sign In</h1>
        <p class="muted">Internal access only.</p>
        <form id="login-form">
          <label>
            Username
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Login</button>
        </form>
        <div id="login-status" class="status"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>Relay Admin UI · Internal</span>
    </footer>

    <script src="/admin/assets/admin.js"></script>
  </body>
</html>
