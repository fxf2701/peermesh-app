apiVersion: batch/v1
kind: CronJob
metadata:
  name: relay-db-backup
spec:
  schedule: "15 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: postgres:16
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: relay-secrets
                      key: DATABASE_URL
                - name: BACKUP_DIR
                  value: /backup
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  stamp=$(date -u +"%Y%m%dT%H%M%SZ")
                  pg_dump -Fc "$DATABASE_URL" > "/backup/relay_${stamp}.dump"
                  sha256sum "/backup/relay_${stamp}.dump" > "/backup/relay_${stamp}.dump.sha256"
              volumeMounts:
                - name: backup
                  mountPath: /backup
          restartPolicy: OnFailure
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: relay-backup-pvc
