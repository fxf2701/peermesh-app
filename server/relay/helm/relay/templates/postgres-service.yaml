{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay.postgres.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "relay.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}
