{{- if .Values.redis.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay.redis.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.service.port }}
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: {{ include "relay.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}
