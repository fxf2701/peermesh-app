{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relay.postgres.secretName" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.existingSecretKey }}: {{ .Values.postgres.auth.password | quote }}
{{- end -}}
