{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relay.envSecretName" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "relay.databaseUrl" . | quote }}
  REDIS_URL: {{ include "relay.redisUrl" . | quote }}
{{- end -}}
